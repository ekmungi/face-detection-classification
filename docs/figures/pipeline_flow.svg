<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-flow-title pipeline-flow-desc" id="pipeline_flow-root">
        <title id="pipeline-flow-title">How one photo becomes a result for each face</title>
        <desc id="pipeline-flow-desc">A photo goes through a face detector with a ResNet-18 backbone and four heads, then an alignment step that cuts two crops of each face; one crop goes to the expression model, whose eight scores are divided by a temperature, and the other to the identity model, whose 512-number embedding is matched against a gallery of enrolled people.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pipeline_flow-root { --color-paper:  #f1efec;
      --color-ink:    #132030;
      --color-muted:  #5a6879;
      --color-accent: #b56a00;
      --font-sans:    'Fira Sans', system-ui, sans-serif;
      --font-mono:    'Fira Mono', ui-monospace, monospace; }
      #pipeline_flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pipeline_flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pipeline_flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="pipeline_flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6879"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f1efec"/>

        <!-- Connectors first, so they sit behind the boxes. -->
        <!-- Photo to detector, detector to alignment: straight, same y. -->
        <line x1="184" y1="282" x2="228" y2="282" stroke="#5a6879" stroke-width="1.2" marker-end="url(#pipeline_flow-arrow)"/>
        <line x1="444" y1="282" x2="488" y2="282" stroke="#5a6879" stroke-width="1.2" marker-end="url(#pipeline_flow-arrow)"/>
        <!-- Alignment to the two models: one bend each, entering through the bottom and the top edge. -->
        <path d="M 704,268 H 868 Q 876,268 876,260 V 180" fill="none" stroke="#5a6879" stroke-width="1.2" marker-end="url(#pipeline_flow-arrow)"/>
        <path d="M 704,296 H 868 Q 876,296 876,304 V 384" fill="none" stroke="#5a6879" stroke-width="1.2" marker-end="url(#pipeline_flow-arrow)"/>
        <!-- Identity to gallery: straight, same y. -->
        <line x1="984" y1="438" x2="1028" y2="438" stroke="#5a6879" stroke-width="1.2" marker-end="url(#pipeline_flow-arrow)"/>

        <!-- Arrow labels beside the vertical segments, on paper masks, 8px from the stroke. -->
        <rect x="884" y="208" width="88" height="16" rx="2" fill="#f1efec"/>
        <text x="888" y="220" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" letter-spacing="0.06em">224 × 224</text>
        <rect x="884" y="340" width="88" height="16" rx="2" fill="#f1efec"/>
        <text x="888" y="352" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" letter-spacing="0.06em">112 × 112</text>

        <!-- Photo: input. -->
        <rect x="40" y="236" width="144" height="92" rx="6" fill="#f1efec"/>
        <rect x="40" y="236" width="144" height="92" rx="6" fill="#5a6879" stroke="#616d7c" stroke-width="1" fill-opacity="0.10"/>
        <rect x="48" y="244" width="40" height="12" rx="2" fill="none" stroke="#616d7c" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="68" y="253" fill="#616d7c" font-size="8" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>
        <text x="112" y="280" fill="#132030" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Photo</text>
        <text x="112" y="300" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">RGB, any size</text>
        <text x="112" y="316" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">≤ 1,280 px</text>

        <!-- 1 Detector: trained network. Taller than the fixed steps, because a network carries one more line. -->
        <rect x="228" y="228" width="216" height="108" rx="6" fill="#f1efec"/>
        <rect x="228" y="228" width="216" height="108" rx="6" fill="#ffffff" stroke="#132030" stroke-width="1"/>
        <rect x="236" y="236" width="56" height="12" rx="2" fill="none" stroke="#132030" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="264" y="245" fill="#132030" font-size="8" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NETWORK</text>
        <text x="336" y="272" fill="#132030" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">1  Detector</text>
        <text x="336" y="292" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">ResNet-18 · 11.5 M</text>
        <text x="336" y="308" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">4 heads, stride-4 map</text>
        <text x="336" y="324" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">box · 5 landmarks · score</text>

        <!-- 2 Alignment: no trained weights. -->
        <rect x="488" y="236" width="216" height="92" rx="6" fill="#f1efec"/>
        <rect x="488" y="236" width="216" height="92" rx="6" fill="#132030" stroke="#5a6879" stroke-width="1" fill-opacity="0.05"/>
        <rect x="496" y="244" width="72" height="12" rx="2" fill="none" stroke="#5a6879" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="532" y="253" fill="#5a6879" font-size="8" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO WEIGHTS</text>
        <text x="596" y="280" fill="#132030" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">2  Alignment</text>
        <text x="596" y="300" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">rotate + scale to the</text>
        <text x="596" y="316" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">ArcFace 5-point template</text>

        <!-- 3 Expression: trained network. -->
        <rect x="768" y="72" width="216" height="108" rx="6" fill="#f1efec"/>
        <rect x="768" y="72" width="216" height="108" rx="6" fill="#ffffff" stroke="#132030" stroke-width="1"/>
        <rect x="776" y="80" width="56" height="12" rx="2" fill="none" stroke="#132030" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="804" y="89" fill="#132030" font-size="8" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NETWORK</text>
        <text x="876" y="116" fill="#132030" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">3  Expression</text>
        <text x="876" y="136" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">ConvNeXt-Tiny · 27.8 M</text>
        <text x="876" y="152" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">8-score head ÷ temperature</text>
        <text x="876" y="168" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">→ 8 probabilities</text>

        <!-- 4 Identity: trained network. -->
        <rect x="768" y="384" width="216" height="108" rx="6" fill="#f1efec"/>
        <rect x="768" y="384" width="216" height="108" rx="6" fill="#ffffff" stroke="#132030" stroke-width="1"/>
        <rect x="776" y="392" width="56" height="12" rx="2" fill="none" stroke="#132030" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="804" y="401" fill="#132030" font-size="8" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NETWORK</text>
        <text x="876" y="428" fill="#132030" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">4  Identity</text>
        <text x="876" y="448" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">IResNet-50 · 43.6 M</text>
        <text x="876" y="464" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">→ 512-number embedding</text>
        <text x="876" y="480" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">CosFace margin: train only</text>

        <!-- 5 Gallery match: the focal block, because its threshold is the weak point. -->
        <rect x="1028" y="392" width="212" height="92" rx="6" fill="#f1efec"/>
        <rect x="1028" y="392" width="212" height="92" rx="6" fill="#b56a00" stroke="#b56a00" stroke-width="1" fill-opacity="0.08"/>
        <rect x="1036" y="400" width="72" height="12" rx="2" fill="none" stroke="#b56a00" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="1072" y="409" fill="#b56a00" font-size="8" font-family="'Fira Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO WEIGHTS</text>
        <text x="1134" y="436" fill="#132030" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">5  Gallery match</text>
        <text x="1134" y="456" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">cosine ≥ 0.52 → name</text>
        <text x="1134" y="472" fill="#5a6879" font-size="12" font-family="'Fira Mono', monospace" text-anchor="middle">else → unknown</text>

        <!-- Editorial callout under the focal block. -->
        <text x="1028" y="516" fill="#b56a00" font-size="14" font-style="italic" font-family="'Fira Sans', sans-serif">
          <tspan x="1028" dy="0">The 0.52 threshold was set on</tspan>
          <tspan x="1028" dy="18">synthetic faces. On real faces it</tspan>
          <tspan x="1028" dy="18">named 98% of strangers.</tspan>
        </text>

        <!-- Legend strip. -->
        <line x1="40" y1="640" x2="1240" y2="640" stroke="#132030" stroke-width="0.8" stroke-opacity="0.12"/>
        <text x="40" y="660" fill="#5a6879" font-size="8" font-family="'Fira Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="672" width="16" height="12" rx="2" fill="#ffffff" stroke="#132030" stroke-width="1"/>
        <text x="64" y="682" fill="#5a6879" font-size="12" font-family="'Fira Sans', sans-serif">Trained network, run from an ONNX file</text>
        <rect x="336" y="672" width="16" height="12" rx="2" fill="#132030" stroke="#5a6879" stroke-width="1" fill-opacity="0.05"/>
        <text x="360" y="682" fill="#5a6879" font-size="12" font-family="'Fira Sans', sans-serif">Fixed calculation, no trained weights</text>
        <rect x="620" y="672" width="16" height="12" rx="2" fill="#5a6879" stroke="#616d7c" stroke-width="1" fill-opacity="0.10"/>
        <text x="644" y="682" fill="#5a6879" font-size="12" font-family="'Fira Sans', sans-serif">Input</text>
        <rect x="712" y="672" width="16" height="12" rx="2" fill="#b56a00" stroke="#b56a00" stroke-width="1" fill-opacity="0.08"/>
        <text x="736" y="682" fill="#5a6879" font-size="12" font-family="'Fira Sans', sans-serif">Needs recalibration before names are trusted</text>
      </svg>
